<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; width: 300px; font: 13px/1.4 system-ui, sans-serif; background: #161b26; color: #e8ecf5; }
  main { padding: 14px; display: grid; gap: 12px; }
  h1 { margin: 0; font-size: 14px; }
  .muted { color: #9aa4b8; font-size: 12px; }
  .card { background: #1f2533; border-radius: 8px; padding: 10px; display: grid; gap: 6px; }
  label { font-size: 12px; color: #9aa4b8; }
  .row { display: flex; gap: 6px; }
  input { flex: 1; min-width: 0; background: #0f131b; color: inherit; border: 1px solid #2f3747; border-radius: 6px; padding: 6px 8px; font: inherit; }
  button { background: #3b6fd8; color: #fff; border: 0; border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button.secondary { background: #2f3747; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #9aa4b8; }
  .dot.ok { background: #5cc97b; } .dot.err { background: #f06f6f; }
  .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<main>
  <h1>Habblaud Conversas</h1>

  <section class="card" id="conv">
    <div class="muted" id="conv-empty">Abra uma conversa no ChatGPT, Claude ou Gemini para escolher a sala dela.</div>
    <div id="conv-info" hidden>
      <div class="muted" id="conv-provider"></div>
      <div class="title" id="conv-title"></div>
    </div>
    <div id="room-box" hidden>
      <label for="room">Sala desta conversa</label>
      <div class="row">
        <input id="room" list="rooms" maxlength="40" placeholder="Ex.: Statlys">
        <datalist id="rooms"></datalist>
        <button id="save-room">Salvar</button>
      </div>
      <div class="muted" id="room-hint"></div>
    </div>
  </section>

  <section class="card">
    <label for="url">Endereço do Habblaud</label>
    <div class="row">
      <input id="url" placeholder="http://localhost:4848">
      <button class="secondary" id="save-url">Salvar</button>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="status-text">Nenhum envio ainda</span></div>
  </section>

  <div class="muted">Envia só o id da conversa, o título, a sala e se a IA está respondendo. Nunca o conteúdo das mensagens.</div>
</main>
<script src="popup.js"></script>
</body>
</html>
